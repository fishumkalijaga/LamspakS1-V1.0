<div class="layout"><aside class="sidebar"><button class="nav active" data-go="start">01 · Mulai & impor FED</button><button class="nav" data-go="results">02 · Penilaian otomatis</button><button class="nav" data-go="detail">03 · Telaah per indikator</button><button class="nav" data-go="required">04 · Syarat perlu Unggul</button><button class="nav" data-go="report">05 · Laporan & ekspor</button><button class="nav" data-go="settings">06 · Data & verifikasi</button><hr style="border:none;border-top:1px solid #e3e8ef;width:100%"><div class="hint">Instrumen: IAPS LAMSPAK 2.0 Unggul Sarjana (73 butir).<br>Skor otomatis bersifat <b>indikatif</b>, bukan keputusan asesor.</div></aside><main class="main" id="main"></main></div><footer>@ramalabs</footer><script type="application/json" id="instrument-data">[{"id":1,"indicator":"Program studi memiliki visi keilmuan yang memuat keunikan program studi sesuai perkembangan IPTEKS, kebutuhan pengguna, serta menunjukkan keunikan program studi yang menjadi keunggulan dari program studi sejenis, dievaluasi secara berkala, dan berkelanjutan.","standard":"1. STANDAR KOMPETENSI LULUSAN","rubric":{"2":"Program Studi telah menetapkan rumusan Visi Keilmuan program studi sesuai dengan perkembangan IPTEKS, kebutuhan pengguna, serta menunjukkan keunikan program studi yang menjadi keunggulan dari program studi sejenis, dievaluasi secara berkala, dan berkelanjutan.","1":"Program Studi telah menetapkan tidak rumusan Visi Keilmuan program studi sesuai dengan perkembangan IPTEKS.","0":"ada nilai kurang dari 1."},"weight":1,"matrixPage":1,"guidance":"Lampirkan SK visi keilmuan, kajian pembeda dengan prodi sejenis, masukan pengguna, hasil evaluasi berkala, serta bukti implementasi lintas kurikulum dan kegiatan tridharma."},{"id":2,"indicator":"Kesesuaian Visi, Misi, Tujuan dan Strategi (VMTS) Unit Pengelola Program Studi (UPPS) terhadap VMTS Perguruan Tinggi (PT) dan visi keilmuan Program Studi (PS) yang dikelolanya.","standard":"","rubric":{"2":"UPPS memiliki: 1) visi yang mencerminkan visi perguruan tinggi dan memayungi visi keilmuan terkait keunikan program studi serta didukung data implementasi yang konsisten, 2) misi, tujuan, dan strategi yang searah dan bersinerji dengan misi, tujuan, dan strategi perguruan tinggi serta mendukung pengembangan program studi dengan data implementasi yang konsisten.","1":"UPPS memiliki: UPPS 1) visi yang mencerminkan visi dan strategi perguruan tinggi namun tidak dengan memayungi visi keilmuan terkait tinggi program studi, program 2) misi, tujuan, dan strategi kurang searah dengan misi, tujuan sasaran, dan strategi perguruan tinggi serta kurang mendukung pengembangan program studi.","0":"memiliki misi, tujuan, yang tidak terkait strategi perguruan dan pengembangan studi."},"weight":1,"matrixPage":1,"guidance":"Perjelas keterlacakan eksplisit visi PT → UPPS → visi keilmuan PS dan buktikan realisasi strategi dengan indikator serta capaian yang terukur."},{"id":3,"indicator":"Profil lulusan program studi ditetapkan berdasarkan hasil kajian terhadap kebutuhan pasar kerja yang dibutuhkan pemerintah dan dunia usaha maupun industri, serta kebutuhan dalam mengembangkan ilmu pengetahuan dan teknologi, dan telah disepakati oleh asosiasi program studi.","standard":"","rubric":{"2":"Profil Lulusan program studi ditetapkan berdasarkan hasil kajian terhadap kebutuhan pasar kerja yang dibutuhkan pemerintah dan dunia usaha maupun industri, serta kebutuhan dalam mengembangkan ilmu pengetahuan dan teknologi, dan telah disepakati oleh asosiasi program studi.","1":"Profil Lulusan program studi Program ditetapkan namun belum Profil mempertimbangkan hasil kajian terhadap kebutuhan pasar kerja yang dibutuhkan pemerintah dan dunia usaha maupun industri, dan/atau tidak mengacu kepada profil yang telah disepakati oleh asosiasi program studi.","0":"studi tidak memiliki Lulusan."},"weight":1,"matrixPage":1,"guidance":"Sediakan laporan kajian kebutuhan kerja, dokumen FGD beserta daftar hadir, berita acara kesepakatan asosiasi, dan SK profil lulusan."},{"id":4,"indicator":"Capaian Pembelajaran Lulusan mencakup kompetensi yang meliputi:\n1) Penguasaan ilmu pengetahuan dan teknologi, kecakapan/keterampilan spesifik dan aplikasinya untuk 1 (satu) atau sekumpulan bidang keilmuan tertentu;\n2) Kecakapan umum yang dibutuhkan sebagai dasar untuk penguasaan ilmu pengetahuan dan teknologi serta bidang kerja yang relevan;\n3) Pengetahuan dan keterampilan yang dibutuhkan untuk dunia kerja dan/atau melanjutkan studi pada jenjang yang lebih tinggi ataupun untuk mendapatkan sertifikasi perofesi;\n4) Kemampuan intelektual untuk berpikir secara mandiri dan kritis sebagai pembelajar sepanjang hayat; dan\n5) Kompetensi tambahan yang menunjukkan kekhasan dan daya saing program studi.","standard":"","rubric":{"2":"Capaian pembelajaran lulusan mencakup kompetensi yang meliputi seluruh aspek: 1) penguasaan ilmu pengetahuan dan teknologi, kecakapan/ keterampilan spesifik dan aplikasinya untuk 1 (satu) atau sekumpulan bidang keilmuan tertentu; 2) kecakapan umum yang dibutuhkan sebagai dasar untuk penguasaan ilmu pengetahuan dan teknologi serta bidang kerja yang relevan; 3) pengetahuan dan keterampilan yang dibutuhkan untuk dunia kerja dan/atau melanjutkan studi pada jenjang yang lebih tinggi ataupun untuk mendapatkan sertifikasi profesi; 4) kemampuan intelektual untuk berpikir secara mandiri dan kritis sebagai pembelajar sepanjang hayat; dan; 5) Kompetensi tambahan yang menunjukkan kekhasan dan daya saing program studi.","1":"Capaian pembelajaran lulusan hanya Program mencakup kompetensi penguasaan menetapkan ilmu pengetahuan dan teknologi, pembelajaran kecakapan/ keterampilan spesifik, dan aplikasinya untuk 1 (satu) atau sekumpulan bidang keilmuan tertentu;","0":"studi tidak Capaian lulusan"},"weight":1,"matrixPage":1,"guidance":"Rumuskan CPL operasional yang dapat diamati dan diukur; pisahkan penguasaan pengetahuan, keterampilan umum/spesifik, serta kekhasan, lalu petakan ke CPMK dan instrumen asesmen."},{"id":5,"indicator":"Kesesuaian Capaian Pembelajaran Lulusan dengan visi dan misi perguruan tinggi, Kerangka Kualifikasi Nasional Indonesia, kebutuhan kompetensi kerja dari dunia kerja, ranah keilmuan program studi (scientific vision), kompetensi utama lulusan (profil lulusan) program studi, dan kurikulum program studi sejenis (asosiasi keilmuan) serta dimutakhirkan secara berkala setiap 4-5 tahun sesuai perkembangan ilmu pengetahuan dan teknologi.","standard":"","rubric":{"2":"Terdapat Bukti Sahih Capaian Pembelajaran Lulusan memiliki kesesuaian dengan visi dan misi perguruan tinggi, Kerangka Kualifikasi Nasional Indonesia; kebutuhan kompetensi kerja dari dunia kerja; ranah keilmuan program studi; kompetensi utama lulusan program studi, kurikulum program studi sejenis, dan dimutakhirkan secara berkala setiap 4-5 tahun sesuai perkembangan ilmu pengetahuan dan teknologi.","1":"Terdapat Bukti Sahih Capaian Capaian Pembelajaran Lulusan memiliki Lulusan kesesuaian dengan Kerangka Kerangka Kualifikasi Nasional Indonesia; ranah Nasional keilmuan program studi; dan ranah dimutakhirkan secara berkala setiap studi. 4-5 tahun.","0":"Pembelajaran Tidak sesuai dengan Kualifikasi Indonesia, dan keilmuan program"},"weight":1,"matrixPage":2,"guidance":"Buat matriks eksplisit VMTS–KKNI–profil lulusan–CPL–mata kuliah–CPMK–instrumen, lengkapi bukti peninjauan kurikulum dan kebutuhan DUDIKA."},{"id":6,"indicator":"Mekanisme penyusunan dan penetapan, serta keterlibatan pemangku kepentingan dalam penyusunan Capaian Pembelajaran Lulusan.","standard":"","rubric":{"2":"Ada mekanisme dalam penyusunan dan penetapan Capaian Pembelajaran Lulusan yang terdokumentasi serta ada keterlibatan pemangku kepentingan internal (dosen atau mahasiswa) dan eksternal (Asosiasi Program Studi, pakar, lulusan, dan pengguna lulusan).","1":"Ada mekanisme dalam penyusunan Tidak dan penetapan Capaian penyusunan Pembelajaran Lulusan yang hanya Capaian melibatkan sebagian pemangku Lulusan. kepentingan internal.","0":"Ada mekanisme dalam dan penetapan Pembelajaran"},"weight":1,"matrixPage":2,"guidance":"Sertakan SOP, undangan, daftar hadir, notulen, masukan tertulis stakeholders internal-eksternal, keputusan penetapan serta bukti tindak lanjut."},{"id":7,"indicator":"Program studi menginformasikan Capaian Pembelajaran Lulusan kepada mahasiswa.","standard":"","rubric":{"2":"Terdapat bukti sahih pelaksanaan sosialisasi Capaian Pembelajaran Lulusan secara berkala kepada mahasiswa melalui media pembelajaran, yang memenuhi aspek: 1) cakupan dan keberlanjutan, 2) umpan balik mahasiswa, 3) media sosialisasi, dan 4) terdokumentasi dengan baik.","1":"Terdapat bukti sahih pelaksanaan Tidak sosialisasi Capaian Pembelajaran pelaksanaan Lulusan kepada mahasiswa melalui Capaian media pembelajaran, yang memenuhi Lulusan aspek: media sosialisasi dan terdokumentasi.","0":"Terdapat bukti sahih sosialisasi Pembelajaran kepada mahasiswa."},"weight":1,"matrixPage":2,"guidance":"Unggah materi sosialisasi CPL, bukti pelaksanaan berkala, cakupan peserta, hasil umpan balik mahasiswa dan tindakan perbaikan."},{"id":8,"indicator":"UPPS melaksanakan monitoring dan evaluasi pemenuhan Capaian Pembelajaran Lulusan dengan menggunakan metode yang sesuai dan terdapat bukti tindak lanjut.","standard":"","rubric":{"2":"Terdapat bukti sahih pelaksanaan monitoring dan evaluasi pemenuhan ketercapaian Capaian Pembelajarn Lulusan yang meliputi 4 (empat) aspek: 1) ketersediaan instrumen monev pemenuhan ketercapaian Capaian Pembelajaran Lulusan, 2) diukur dengan metode yang sahih dan relevan, 3) bukti pemanfaatan hasil penilaian pemenuhan Capaian Pembelajaran Lulusan digunakan untuk meningkatkan capaian pembelajaran lulusan, dan 4) terdapat peningkatan Capaian Pembelajaran Lulusan dari waktu ke waktu dalam 3 tahun terakhir.","1":"Analisis monitoring dan evaluasi UPPS Capaian Pembelajaran Lulusan monitoring hanya memenuhi aspek ketersediaan Capaian instrumen monitoring dan evaluasi Lulusan. pemenuhan ket Jumlah rata-rata Publikasi ilmiah ≥ 50% NDPRPS","1":"Jumlah rata-rata Publikasi ilmiah \u003c tidak 50% NDPRPS 1","0":"ada nilai kurang dari standar PERLU -STANDAR NDPRPS= dosen program"},"weight":5,"matrixPage":12,"guidance":"Periksa tiap publikasi pada laman jurnal/penerbit resmi (bukan hanya tautan Drive), ISSN, komposisi editor/penulis lintas negara, periode 3 tahun, relevansi topik, dan identitas DPRPS."},{"id":56,"indicator":"Persentase DPRPS yang menjadi anggota asosiasi keilmuan yang masih berlaku.\nTabel 24","standard":"","rubric":{"2":"Jika ≥ 50% Dosen menjadi anggota asosiasi keilmuan","1":"Jika 25% ≥ Dosen\u003c50% menjadi tidak anggota asosiasi keilmuan 1","0":"ada nilai kurang dari SYARAT UNGGUL LAM-SPAK"},"weight":1,"matrixPage":12,"guidance":"Prioritas syarat perlu Unggul: tetapkan daftar final DPRPS, hitung keanggotaan aktif asosiasi prodi/profesi sesuai definisi rubrik; lampirkan kartu anggota, masa berlaku, surat asosiasi, dan periksa perbedaan asosiasi prodi seperti ASPIKOM versus asosiasi individu."},{"id":57,"indicator":"Kualifikasi dan kecukupan tenaga kependidikan berdasarkan jenis pekerjaannya (administrasi, pustakawan, teknisi, dan lain-lain).\nTabel 25","standard":"","rubric":{"2":"UPPS memiliki tenaga kependidikan yang memenuhi tingkat kecukupan dan kualifikasi berdasarkan kebutuhan layanan program studi dan proses administrasi menggunakan sistem informasi yang terhubung dengan jaringan luas/internet, software yang berlisensi dengan jumlah yang memadai mendukung pelaksanaan akademik, fungsi unit pengelola, serta pengembangan program studi","1":"UPPS memiliki tenaga kependidikan UPPS yang memenuhi tingkat kecukupan kependidikan dan/atau kualifikasi berdasarkan memenuhi kebutuhan layanan program studi dan dan kualifikasi mendukung pelaksanaan akademik. kebutuhan studi.","0":"memiliki tenaga Jumlah yang tidak kependidikan tingkat kecukupan 3 (tiga) berdasarkan kependidikan layanan program (satu) perpustakaan setiap Kualifikasi kependidikan b   60:'Verifikasi kebijakan, standar pengelolaan, modul, log pemanfaatan belajar, dan mutu fasilitas secara terpisah.'
};
function aspectList(id){
 const known=SPEC[id];if(known)return known.map(([label,rx])=>({label,rx}));
 const a=get(id),r=String(a.rubric?.['2']||'');
 let sections=[];
 if(/(?:^|\s)[1-7][.)]\s/.test(r)) sections=r.split(/(?:^|\s)[1-7][.)]\s/g).map(t=>txt(t)).filter(t=>t.length>18).slice(0,7);
 else if(r.includes(';'))sections=r.split(/;\s*/g).map(txt).filter(t=>t.length>20).slice(0,6);
 // Free-text rubrics are not decomposed into artificial scoring conditions.
 return sections.map(t=>({label:t.slice(0,115),rx:null}));
}
function evidenceSignals(s){
 const patterns=[['Nomor SK/ketetapan',/(?:SK|Surat Keputusan)[\s\S]{0,45}(?:No\.?|Nomor|\b\d{2,4}\/)/i],['Tabel atau angka hasil',/(?:Tabel\s*\d+|Rekap(?:itulasi)?|\d{1,3}(?:[,.]\d+)?\s*%)/i],['Waktu/periode',/(?:\bTS(?:-[1-4])?\b|20\d\d|triwulan|semester)/i],['Kegiatan tindak lanjut',/(?:tindak lanjut|rencana perbaikan|hasil perbaikan)/i],['Nomor/tautan bukti',/(?:https?:\/\/|doi\.org|nomor dokumen|lampiran)/i]];
 return patterns.filter(([,r])=>r.test(s)).map(([n])=>n);
}
function nearExcerpt(source,rx){let m=rx?.exec(source);if(!m)return'';let begin=Math.max(0,m.index-95),end=Math.min(source.length,m.index+Math.max(m[0].length,60)+155);return txt(source.slice(begin,end)).slice(0,310);}
function numstate(id){st.numeric=st.numeric||{};return st.numeric[id]||(st.numeric[id]={});}
function parseNumber(x){if(x===undefined||x===null||String(x).trim()==='')return NaN;let s=String(x).trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n:NaN;}
function calcNumeric(id){
 let v=numstate(id),f=k=>parseNumber(v[k]),vals=[],score=null,result='',missing=[];
 const valid=(n,min=0,max=Infinity)=>Number.isFinite(n)&&n>=min&&n<=max;
 if(id===9){let weights=['n0','n1','n2'].map(f),gpas=['g0','g1','g2'].map(f);let ok=weights.every(n=>valid(n,0)&&Number.isInteger(n))&&gpas.every(n=>valid(n,0,4))&&weights.reduce((a,b)=>a+b,0)>0;if(ok){let value=weights.reduce((t,n,i)=>t+n*gpas[i],0)/weights.reduce((a,b)=>a+b,0);score=value>=3.25?2:1;result=`RIPK tertimbang tiga tahun ${value.toFixed(3)}; ambang rubrik ≥ 3,25. Perlu memastikan satuan rata-rata berasal dari lulusan dan bobot per tahun benar.`;}else missing.push('Jumlah lulusan dan IPK rata-rata setiap TS-2, TS-1, TS secara lengkap dan valid');}
 if(id===16){let n=f('graduates'),r=f('respondents'),m=f('matched');if(valid(n,1)&&valid(r,1)&&valid(m,0)&&[n,r,m].every(Number.isInteger)&&r<=n&&m<=r){let p=100*r/n,q=100*m/r,required=n>=300?30:50-(n/300)*20;result=`Respons tracer ${p.toFixed(2)}% (minimum ${required.toFixed(2)}%); kesesuaian pekerjaan ${q.toFixed(2)}% dari responden. `;if(p>=required){score=q>=60?2:1;result+='Ambang respon terpenuhi; klasifikasi pekerjaan pertama dan responden tetap perlu diuji.';}else{result+='Cakupan responden di bawah minimum: skor tidak ditetapkan karena perlu penyesuaian sesuai ketentuan instrumen.';missing.push('Kecukupan responden tracer untuk menghitung skor yang sah');}}else missing.push('Populasi lulusan, responden, dan responden sesuai bidang kerja yang sah');}
 if(id===55){let avg=f('publications'),d=f('dprps');if(valid(avg,0)&&valid(d,1)&&Number.isInteger(d)){let q=100*avg/d;score=q>=50?2:1;result=`Rasio rerata publikasi jurnal internasional relevan terhadap NDPRPS ${q.toFixed(2)}%; ambang rubrik ≥ 50%. Angka publikasi harus merupakan jumlah rerata menurut definisi matriks, bukan seluruh keluaran yang tidak memenuhi syarat.`;}else missing.push('Jumlah rerata publikasi relevan dan NDPRPS dengan sumber yang dapat diaudit');}
 if(id===56){let a=f('active'),d=f('dprps');if(valid(a,0)&&valid(d,1)&&[a,d].every(Number.isInteger)&&a<=d){let q=100*a/d;score=q>=50?2:1;result=`Keanggotaan asosiasi aktif DPRPS ${q.toFixed(2)}% (${a}/${d}); skor 2 membutuhkan ≥ 50%. Perhitungan memakai dosen unik, bukan jumlah sertifikat.`;}else missing.push('Jumlah DPRPS unik, jumlah anggota aktif unik, dan bukti masa berlaku');}
 if(id===60){let keys=['k1','k2','k3','k4','k5'];let checked=keys.filter(k=>v[k]===true).length;result=(checked||String(v.docs||'').trim())?`Konfirmasi pemeriksa pada ${checked} dari 5 aspek laboratorium. `:'';if(checked===5&&v.docs&&String(v.docs).trim().length>12){score=2;result+='Lima aspek dicatat memenuhi; setiap dokumen dan hasil observasi tetap perlu ditelaah.';}else if(checked>=3&&v.docs&&String(v.docs).trim().length>12){score=1;result+='Belum seluruh aspek memenuhi, sehingga belum dapat diindikasikan skor 2.';}else missing.push('Bukti konfirmasi seluruh aspek, khususnya penggunaan nyata dan mutu perangkat, dengan identitas sumber');}
 return {score,result,missing};
}
function computeOne(id){
 const a=get(id),s=seg(id),r=rv(id),n=NUMERIC.has(id)||REQUIRED.includes(id),structured=REQUIRED.includes(id)?calcNumeric(id):null;
 if(!s&&!String(r.manual||'').trim()&&!structured?.result)return {level:'none',suggested:null,description:'Belum ada bagian FED yang terpetakan atau data pemeriksaan untuk indikator ini. Tidak ada dasar untuk menganggap skor 0 atau 1.',recommendation:EXPECTED[id]||a.guidance||'Masukkan narasi FED, bukti sahih, serta periksa kriteria dalam matriks penilaian.',evidence:[],coverage:0,missing:[],confidence:'belum tersedia',excerpt:'',page:null,method:null,aspects:[],structResult:'',conflicts:[]};
 let orig=s?.text||'',substantive=txt(orig.slice(Math.max(0,s?.headingLength||0))+'\n'+(r.manual||''));
 let signals=evidenceSignals(substantive),aspects=aspectList(id);
 let checks=aspects.map(x=>{let found=x.rx?x.rx.test(substantive):false;return {label:x.label,found,quote:found?nearExcerpt(substantive,x.rx):'',kind:x.rx?'konteks naratif terdeteksi':'butuh pemeriksaan manual'};});
 let found=checks.filter(x=>x.found).length;let missing=checks.filter(x=>!x.found).map(x=>x.label);
 let negatives=[...substantive.matchAll(NEGATION)].slice(0,4).map(m=>txt(substantive.slice(Math.max(0,m.index-55),Math.min(substantive.length,m.index+115))));
 let anchored=s?.method==='nomor';let description='',level=n?'numeric':'review',suggested=null;let name=s?.page?`halaman PDF ${s.page}`:'naskah FED';
 let known=aspects.length>0;
 if(s&&anchored)description+=`Teks indikator terpetakan dari nomor pertanyaan pada ${name}. `;
 else if(s)description+='Bagian ini hanya hasil pencocokan semantik dan perlu dikonfirmasi nomor pertanyaannya. ';
 else description+='Belum ada pemetaan teks FED; penelaah memasukkan data tambahan. ';
 if(known){description+=`Dari ${aspects.length} unsur pemeriksaan yang dipetakan, ${found} muncul secara eksplisit dalam narasi; pencocokan tersebut belum membuktikan substansi atau dokumen aslinya. `;if(found)description+=`Unsur yang dinarasikan: ${checks.filter(x=>x.found).slice(0,3).map(x=>x.label).join('; ')}. `;if(missing.length)description+=`Unsur yang belum ditunjukkan secara jelas: ${missing.slice(0,3).join('; ')}. `;}
 else description+='Rubrik ini tidak cukup terurai menjadi unsur yang aman untuk pemberian skor otomatis; diperlukan telaah langsung rubrik 2/1/0. ';
 if(signals.length)description+=`Rujukan yang disebutkan meliputi ${signals.join(', ')}; berkas rujukan belum diaudit. `;
 if(negatives.length)description+='Ada pernyataan keterbatasan atau penyangkalan yang perlu ditelaah sebelum menarik kesimpulan. ';
 if(n){let q=structured||{score:null,result:'',missing:[]};if(q.result)description+=q.result+' ';else description+='Indikator numerik memerlukan nilai terstruktur, penyebut dan periode; angka yang tersebar dalam narasi tidak cukup untuk penetapan skor. ';
  suggested=q.score;level=q.score!==null?'numeric-ready':'numeric';missing=missing.concat(q.missing);}
 else if(!anchored&&!r.manual){description+='Kecocokan belum cukup untuk menilai pemenuhan; pastikan pemetaan nomor butir. ';level='review';}
 else if(known&&checks.every(x=>x.found)&&signals.length>=2&&!negatives.length){level='possible2';suggested=2;description+='Seluruh unsur naratif yang dapat diperiksa terdeteksi bersama petunjuk sumber; **indikasi maksimum 2 berdasarkan teks**, bukan konfirmasi pemenuhan. ';}
 else if(known&&found>0&&signals.length>=1&&!negatives.length){level='possible1';suggested=1;description+='Sebagian unsur dan petunjuk sumber muncul, menghasilkan **indikasi awal 1** yang tetap harus diverifikasi terhadap rubrik skor 1. ';}
 else{level='review';description+='Belum cukup dasar untuk mengusulkan skor. ';}
 let rec=EXPECTED[id]||a.guidance||'Periksa keterlaksanaan, hasil dan bukti sahih sesuai rubrik indikator.';
 if(missing.length)rec+=' Unsur yang perlu dibuktikan atau diklarifikasi: '+missing.slice(0,6).join('; ')+'.';
 if(!signals.some(x=>x==='Nomor SK/ketetapan'||x==='Nomor/tautan bukti'))rec+=' Cantumkan identitas berkas/tautan resmi dan nomor halaman sumber.';
 if(negatives.length)rec+=' Jelaskan tindak lanjut terhadap keterbatasan yang diakui dalam FED.';
 if(n&&structured?.score!==null)rec+=' Cocokkan setiap angka terhadap tabel instrumen dan bukti primer sebelum skor difinalisasi.';
 return {level,suggested,coverage:aspects.length?found/aspects.length:0,evidence:signals,description:description.replace(/\*\*/g,''),recommendation:rec,missing,confidence:anchored?'nomor pertanyaan terdeteksi; keabsahan bukti belum diverifikasi':s?'pemetaan semantik belum terkonfirmasi':'isian penelaah',excerpt:snippetText(substantive),page:s?.page||null,method:s?.method||'manual',aspects:checks,structResult:structured?.result||'',conflicts:negatives};
}
function badge(x){let v=x?.level||'none';let kind={none:'low',review:'warn',possible1:'warn',possible2:'good',numeric:'purple','numeric-ready':'good'}[v]||'warn';let label={none:'Belum ada data',review:'Perlu pemeriksaan',possible1:'Indikasi teks: 1',possible2:'Indikasi teks: 2',numeric:'Data angka belum cukup','numeric-ready':`Hitung awal: ${x.suggested}`}[v]||'Belum dievaluasi';return `<span class="chip ${kind}">${label}</span>`;}
function numericForm(id){if(!REQUIRED.includes(id))return '';
 let v=numstate(id),inp=(key,label,ph='')=>`<div class="field"><label>${esc(label)}</label><input type="number" step="any" min="0" data-num="${key}" data-id="${id}" placeholder="${esc(ph)}" value="${esc(v[key]??'')}"></div>`;
 let body='';
 if(id===9)body=`<div class="grid3">${inp('n0','Jumlah lulusan TS-2')}${inp('g0','IPK rata-rata TS-2')}${inp('n1','Jumlah lulusan TS-1')}${inp('g1','IPK rata-rata TS-1')}${inp('n2','Jumlah lulusan TS')}${inp('g2','IPK rata-rata TS')}</div>`;
 if(id===16)body=`<div class="grid3">${inp('graduates','Total lulusan populasi TS-4 s.d. TS-2')}${inp('respondents','Jumlah responden tracer valid')}${inp('matched','Responden dengan pekerjaan pertama sesuai bidang')}</div>`;
 if(id===55)body=`<div class="grid2">${inp('publications','Rerata publikasi jurnal internasional relevan (sesuai definisi matriks)')}${inp('dprps','Jumlah NDPRPS')}</div>`;
 if(id===56)body=`<div class="grid2">${inp('active','Jumlah DPRPS unik dengan keanggotaan asosiasi masih berlaku')}${inp('dprps','Jumlah DPRPS unik')}</div>`;
 if(id===60)body=`<div class="grid2">${[['k1','Kebijakan formal lembaga'],['k2','Standar/SOP pengelolaan'],['k3','Modul atau instrumen praktikum'],['k4','Bukti penggunaan untuk pembelajaran'],['k5','Kecukupan dan mutu sarana']].map(([k,t])=>`<label style="display:flex;gap:9px;align-items:center;padding:9px;background:#f5f8fb;border-radius:9px"><input type="checkbox" data-num="${k}" data-id="${id}" ${v[k]?'checked':''}> ${esc(t)}</label>`).join('')}</div>`;
 let cv=calcNumeric(id);return `<div class="panel"><h3>Perhitungan terstruktur — syarat perlu Unggul</h3><p class="small muted">Gunakan angka dari FED yang telah direkonsiliasi. Ini evaluasi awal berdasarkan input pengguna; bukan ekstraksi angka otomatis yang dipastikan benar.</p>${body}<div class="field"><label>Identitas dan halaman sumber angka / daftar bukti</label><textarea data-num="docs" data-id="${id}" rows="2" placeholder="Mis. Tabel nomor, halaman FED, rekap induk, file sumber, tanggal verifikasi">${esc(v.docs||'')}</textarea></div><div class="note">${esc(cv.result||'Lengkapi seluruh input sesuai definisi matriks untuk menghitung hasil sementara.')}</div><button class="btn primary" onclick="recalc();render();showToast('Analisis angka diperbarui berdasarkan input terstruktur.')">Hitung & perbarui</button></div>`;
}

function detail(){let res=baseDetail();let n=st.selected,x=st.auto[n]||computeOne(n);const html=`<div class="panel"><h3>Audit unsur rubrik — pelacakan pernyataan FED</h3><p class="small muted">Terdeteksi hanya berarti ada frasa dalam FED; penilai tetap harus memeriksa berkas dan isi substansinya.</p><div class="list">${(x.aspects||[]).length?(x.aspects||[]).map((p,i)=>`<div class="record"><div class="split"><b>${i+1}. ${esc(p.label)}</b><span class="chip ${p.found?'good':'warn'}">${p.found?'Terindikasi pada teks':'Belum terbukti oleh pencocokan'}</span></div>${p.quote?`<div class="quote" style="margin-top:7px">${esc(p.quote)}</div>`:''}</div>`).join(''):'<p class="muted">Tidak ada unsur yang cukup terstruktur untuk pengujian teks otomatis; baca rubrik secara langsung.</p>'}</div>${(x.conflicts||[]).length?`<div class="note alert"><b>Kalimat keterbatasan terdeteksi:</b> ${esc(x.conflicts.join(' • '))}</div>`:''}</div>`;
 const marker='<div class="panel"><h3>Konfirmasi dan perbaikan penelaah</h3>';
 if(!res.includes(marker))return res+html+numericForm(n);
 return res.replace(marker,html+numericForm(n)+marker);
}

function required(){let x=baseRequired();x=x.replace('Tidak ada prediksi akreditasi atau label “memenuhi syarat perlu” secara otomatis hanya dari narasi FED.', 'Lima indikator ini mempunyai perhitungan terstruktur. Status yang ditampilkan merupakan hasil sementara dari angka yang dimasukkan dan tidak menggantikan pemeriksaan bukti sumber.');return x;}

function settings(){let s=baseSettings();s=s.replace('Skor 1/2 yang tampil adalah indikasi naratif, tidak menunjukkan validitas dokumen.', 'Skor naratif hanya ditawarkan ketika unsur eksplisit dan petunjuk sumber terdeteksi; angka syarat perlu dihitung dari isian terstruktur lengkap. Semua hasil tetap memerlukan verifikasi.');return s;}

async function applyFed(text,name,pages,kind){await baseApplyFed(text,name,pages,kind);if(st.file.name){st.numeric={};recalc();render();}}
document.addEventListener('input',e=>{if(!e.target.matches('[data-num]'))return;let n=Number(e.target.dataset.id),k=e.target.dataset.num;if(!REQUIRED.includes(n))return;let row=numstate(n);row[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();});
document.addEventListener('change',e=>{if(!e.target.matches('[data-num]'))return;let id=Number(e.target.dataset.id),key=e.target.dataset.num;numstate(id)[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;st.auto[id]=computeOne(id);save();});

if(!Object.keys(st.auto).length)recalc();
render();

</script></body></html>
